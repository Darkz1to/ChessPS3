# Builds the PS3 version of HK3DS (PSL1GHT). Produces:
#   hk3ds_ps3.pkg / .self        standard art
#   hk3ds_ps3_hd.pkg / .self     HD art (use with the romfs_hd data)
# The game DATA is not built here (it comes from your own copy of the game, converted on your PC - see PS3_TUTORIAL.md).
name: Build PS3

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Host packages (Cg shader compiler + libs for the PSL1GHT tools)
        run: |
          sudo apt-get update
          sudo apt-get -y install --no-install-recommends make gcc libgmp-dev libssl-dev zlib1g-dev libelf-dev pkg-config nvidia-cg-toolkit

      - name: Download the PS3 toolchain (pre-compiled ps3dev)
        run: |
          curl -sL https://github.com/ps3dev/ps3toolchain/releases/download/2026-06-09/ps3dev-92534e60-ubuntu-latest.tar.gz | tar xz -C "$GITHUB_WORKSPACE"
          echo "PS3DEV=$GITHUB_WORKSPACE/ps3dev"  >> "$GITHUB_ENV"
          echo "PSL1GHT=$GITHUB_WORKSPACE/ps3dev" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/ps3dev/bin"     >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ps3dev/ppu/bin" >> "$GITHUB_PATH"

      - name: Build (standard art)
        run: make -f Makefile.ps3 pkg

      - name: Build (HD art)
        run: make -f Makefile.ps3 HD=1 pkg

      - name: Collect
        run: |
          mkdir -p out
          cp hk3ds_ps3.pkg hk3ds_ps3.self hk3ds_ps3_hd.pkg hk3ds_ps3_hd.self out/
          cp PS3_TUTORIAL.md out/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: hk3ds-ps3
          path: out/*
          if-no-files-found: error
